apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: adaptive-concurrency-policy
  namespace: default
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: example-route
  adaptiveConcurrency:
    concurrencyLimitExceededStatus: 503
    gradientController:
      sampleAggregatePercentile: 50
      concurrencyLimitParams:
        maxConcurrencyLimit: 1000
        concurrencyUpdateInterval: 100ms
      minRTTCalcParams:
        interval: 30s
        requestCount: 50
        jitter: 15
        minConcurrency: 3
        buffer: 25
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: example-route
  namespace: default
spec:
  parentRefs:
    - name: eg
      namespace: default
  hostnames:
    - "example.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: backend-service
          port: 80
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: default
spec:
  ports:
    - port: 80
      targetPort: 8080
  selector:
    app: backend
